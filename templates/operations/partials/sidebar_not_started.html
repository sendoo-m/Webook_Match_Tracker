<!-- Path: config/templates/operations/partials/sidebar_not_started.html -->
<div id="sidebar-not-started" class="card panel" hx-swap-oob="true">
    <h2 class="panel-title">Needs First Action</h2>

    {% if not_started_items %}
        <div class="sidebar-list">
            {% for item in not_started_items %}
                <div class="sidebar-item sidebar-item--warning">
                    <div class="sidebar-item-title">{{ item.template_item.title }}</div>
                    <div class="help-text">{{ item.template_item.category.name }}</div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="help-text">Great — no untouched items left.</p>
    {% endif %}
</div>
