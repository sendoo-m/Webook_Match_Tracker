<!-- File: templates/operations/partials/activity_log_page.html -->
<!-- Path: config/templates/operations/partials/activity_log_page.html -->
<div id="activity-log-more">
    <div class="timeline-list">
        {% for log in activity_logs %}
            {% include "operations/partials/activity_log_item.html" with log=log %}
        {% endfor %}
    </div>

    {% if page_obj.has_next %}
        <div>
            <button
                class="btn"
                hx-get="{% url 'operations:match-activity-log' match.pk %}?page={{ page_obj.next_page_number }}"
                hx-target="#activity-log-more"
                hx-swap="outerHTML"
            >
                Load more
            </button>
        </div>
    {% endif %}
</div>
