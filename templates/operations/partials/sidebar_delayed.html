<!-- File: templates/operations/partials/sidebar_delayed.html -->
<!-- Path: config/templates/operations/partials/sidebar_delayed.html -->
<div id="sidebar-delayed" class="card panel" hx-swap-oob="true">
    <h2 class="panel-title">Delayed</h2>

    {% if delayed_items_list %}
        <div class="sidebar-list">
            {% for item in delayed_items_list %}
                <div class="sidebar-item sidebar-item--danger">
                    <div class="sidebar-item-title">{{ item.template_item.title }}</div>
                    <div class="help-text">{{ item.template_item.category.name }}</div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="help-text">No delayed items.</p>
    {% endif %}
</div>
