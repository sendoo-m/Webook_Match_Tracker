{% load i18n %}
<div id="sidebar-in-progress" class="card panel" hx-swap-oob="true">
    <h2 class="panel-title">{% trans "In Progress" %}</h2>

    {% if in_progress_items %}
        <div class="sidebar-list">
            {% for item in in_progress_items %}
                <div class="sidebar-item sidebar-item--info">
                    <div class="sidebar-item-title">{{ item.template_item.title }}</div>
                    <div class="help-text">{{ item.template_item.category.name }}</div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="help-text">{% trans "No items currently in progress." %}</p>
    {% endif %}
</div>
