{# control_panel/_toggle_active_button.html #}
{% load i18n %}
<form method="post" action="{% url toggle_url_name obj.pk %}" class="logout-form">
    {% csrf_token %}
    <button type="submit" class="btn btn-secondary btn-sm">
        {% if obj.is_active %}{% trans "Deactivate" %}{% else %}{% trans "Activate" %}{% endif %}
    </button>
</form>
